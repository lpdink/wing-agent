[project]
name = "wing-cli"
dynamic = ["version"]
description = "Wing TUI/CLI — native Rust binary for the Wing agent platform"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["agent", "coding-agent", "llm", "cli", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/lpdink/wing-agent"
Repository = "https://github.com/lpdink/wing-agent"
Issues = "https://github.com/lpdink/wing-agent/issues"
Changelog = "https://github.com/lpdink/wing-agent/releases"
Documentation = "https://github.com/lpdink/wing-agent/blob/develop/docs/zh/README.md"

[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
