[package]
name = "wing"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wing"
path = "src/main.rs"

[lib]
name = "wing"
path = "src/lib.rs"

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"

[dependencies]
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
ratatui-image = { workspace = true }
image = { workspace = true }
pulldown-cmark = { workspace = true }
syntect = { workspace = true }
two-face = { workspace = true }
similar = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
unicode-width = { workspace = true }
unicode-linebreak = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
wing-api-client = { path = "../wing-api-client" }
wing-math = { path = "../wing-math" }
agent-client-protocol = { workspace = true }

[dev-dependencies]
pretty_assertions = "1"
criterion = "0.5"
# Integration tests build their own PNG fixtures through the same decoder the library uses.
image = { workspace = true }
# acp_e2e: the official ACP SDK drives the real `wing acp` binary as a client
# (spawns it as a child process; `process` adds the AcpAgent transport).
agent-client-protocol = { workspace = true, features = ["process"] }
# acp_e2e: in-process fake gateway. hyper/http-body-util/bytes are already in the
# lock file (transitive deps of reqwest); the WS side reuses tokio-tungstenite.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[[bench]]
name = "stream_render"
harness = false

[[bench]]
name = "tool_args_stream"
harness = false

[[bench]]
name = "image_frame"
harness = false

