name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to check'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # ── Python: lint + format + type check + dead code + test ──
  python-check:
    name: Python Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check libs/

      - name: Ruff format check
        run: uv run ruff format --check libs/

      - name: Type check (ty)
        run: uv run ty check libs

      - name: Dead code detection (vulture)
        run: uv run vulture libs/ --min-confidence 70 --exclude .venv/

      - name: Unit tests
        run: uv run pytest libs/core/tests/

  # ── Probe: deterministic integration scenarios (fake provider) ─
  probe-check:
    name: Probe Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Probe scenarios
        run: make test-probe

  # ── TypeScript: lint + format + types + tests + build + package ──
  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Version comes from package.json#packageManager; keep it pinned there.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extensions/vscode/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extensions/vscode/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Prettier check
        run: pnpm run format:check

      - name: Type check (tsc --noEmit)
        run: pnpm run typecheck

      - name: Unit tests (vitest projects; includes the layer guard)
        run: pnpm run test

      - name: Build (extension host + webview)
        run: pnpm run build

      - name: Build webview preview harness
        run: pnpm run build:preview

      - name: Package (.vsix)
        run: pnpm run package

      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: wing-vscode-vsix
          path: extensions/vscode/wing-vscode.vsix
          if-no-files-found: error

  # ── Rust: format + clippy + test ─────────────────────────────
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt check
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy -- -D warnings

      - name: Cargo test
        run: cargo test
