name: Images

on:
  push:
    # TODO(merge 前移除 feature/dingtalk): 仅为首次部署前在特性分支触发构建
    branches: [develop, feature/dingtalk]
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支/commit（默认当前分支）"
        required: false
        type: string
        default: ""
      tag:
        description: "应用镜像 tag（默认 develop）"
        required: false
        type: string
        default: "develop"

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  NS: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAME_SPACE }}

jobs:
  # ── 基础镜像（依赖层，tag = 内容哈希；未变化时缓存秒过）──

  base-py:
    name: wing-py-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/registry-setup
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - id: tags
        run: echo "base=$(sha256sum uv.lock | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.base-py
          push: true
          tags: ${{ env.NS }}/wing-py-base:${{ steps.tags.outputs.base }}
          cache-from: type=gha,scope=base-py
          cache-to: type=gha,mode=max,scope=base-py

  base-devbox:
    name: wing-devbox-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/registry-setup
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - id: tags
        run: |
          echo "base=$(cat uv.lock deploy/docker/Dockerfile.base-devbox | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.base-devbox
          push: true
          tags: ${{ env.NS }}/wing-devbox-base:${{ steps.tags.outputs.base }}
          cache-from: type=gha,scope=base-devbox
          cache-to: type=gha,mode=max,scope=base-devbox

  # ── 应用镜像（基础镜像之上叠代码薄层，全部并行）──

  gateway:
    name: wing-gateway
    needs: base-py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/registry-setup
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - id: tags
        run: |
          echo "base=$(sha256sum uv.lock | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.gateway
          push: true
          build-args: |
            REGISTRY=${{ env.NS }}
            BASE_TAG=${{ steps.tags.outputs.base }}
            VERSION=0.0.0+${{ steps.tags.outputs.sha }}
          tags: |
            ${{ env.NS }}/wing-gateway:${{ inputs.tag || 'develop' }}
            ${{ env.NS }}/wing-gateway:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=app-gateway
          cache-to: type=gha,mode=max,scope=app-gateway

  dingtalk:
    name: wing-dingtalk
    needs: base-py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/registry-setup
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - id: tags
        run: |
          echo "base=$(sha256sum uv.lock | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.dingtalk
          push: true
          build-args: |
            REGISTRY=${{ env.NS }}
            BASE_TAG=${{ steps.tags.outputs.base }}
          tags: |
            ${{ env.NS }}/wing-dingtalk:${{ inputs.tag || 'develop' }}
            ${{ env.NS }}/wing-dingtalk:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=app-dingtalk
          cache-to: type=gha,mode=max,scope=app-dingtalk

  devbox:
    name: wing-devbox
    needs: base-devbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/registry-setup
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - id: tags
        run: |
          echo "base=$(cat uv.lock deploy/docker/Dockerfile.base-devbox | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.devbox
          push: true
          build-args: |
            REGISTRY=${{ env.NS }}
            BASE_TAG=${{ steps.tags.outputs.base }}
          tags: |
            ${{ env.NS }}/wing-devbox:${{ inputs.tag || 'develop' }}
            ${{ env.NS }}/wing-devbox:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=app-devbox
          cache-to: type=gha,mode=max,scope=app-devbox

  proxy:
    name: wing-ai-proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/registry-setup
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - id: tags
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.proxy
          push: true
          tags: |
            ${{ env.NS }}/wing-ai-proxy:${{ inputs.tag || 'develop' }}
            ${{ env.NS }}/wing-ai-proxy:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=app-proxy
          cache-to: type=gha,mode=max,scope=app-proxy
