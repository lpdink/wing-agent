name: Images

on:
  push:
    # TODO(merge 前移除 feature/dingtalk): 仅为首次部署前在特性分支触发构建
    branches: [develop, feature/dingtalk]
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支/commit（默认当前分支）"
        required: false
        type: string
        default: ""
      tag:
        description: "应用镜像 tag（默认 develop）"
        required: false
        type: string
        default: "develop"

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Compute base tags
        id: tags
        run: |
          LOCK_HASH=$(sha256sum uv.lock | cut -c1-12)
          DEVBOX_HASH=$(cat uv.lock deploy/docker/Dockerfile.base-devbox | sha256sum | cut -c1-12)
          SHA_SHORT=$(git rev-parse --short HEAD)
          APP_TAG="${{ inputs.tag || 'develop' }}"
          {
            echo "lock_hash=$LOCK_HASH"
            echo "devbox_hash=$DEVBOX_HASH"
            echo "sha=$SHA_SHORT"
            echo "app_tag=$APP_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "base-py=${LOCK_HASH} base-devbox=${DEVBOX_HASH} app=${APP_TAG}+${SHA_SHORT}"

      # ── 基础镜像（稳定层；tag = 内容哈希，未变化时秒过）──

      - name: Build & push wing-py-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.base-py
          push: true
          tags: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}/wing-py-base:${{ steps.tags.outputs.lock_hash }}
          cache-from: type=gha,scope=base-py
          cache-to: type=gha,mode=max,scope=base-py

      - name: Build & push wing-devbox-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.base-devbox
          push: true
          tags: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}/wing-devbox-base:${{ steps.tags.outputs.devbox_hash }}
          cache-from: type=gha,scope=base-devbox
          cache-to: type=gha,mode=max,scope=base-devbox

      # ── 应用镜像（基础镜像之上叠代码薄层）──

      - name: Build & push wing-gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.gateway
          push: true
          build-args: |
            REGISTRY=${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}
            BASE_TAG=${{ steps.tags.outputs.lock_hash }}
          tags: |
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}/wing-gateway:${{ steps.tags.outputs.app_tag }}
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}/wing-gateway:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=app-gateway
          cache-to: type=gha,mode=max,scope=app-gateway

      - name: Build & push wing-dingtalk
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.dingtalk
          push: true
          build-args: |
            REGISTRY=${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}
            BASE_TAG=${{ steps.tags.outputs.lock_hash }}
          tags: |
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}/wing-dingtalk:${{ steps.tags.outputs.app_tag }}
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}/wing-dingtalk:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=app-dingtalk
          cache-to: type=gha,mode=max,scope=app-dingtalk

      - name: Build & push wing-devbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.devbox
          push: true
          build-args: |
            REGISTRY=${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}
            BASE_TAG=${{ steps.tags.outputs.devbox_hash }}
          tags: |
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}/wing-devbox:${{ steps.tags.outputs.app_tag }}
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}/wing-devbox:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=app-devbox
          cache-to: type=gha,mode=max,scope=app-devbox

      - name: Build & push wing-ai-proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.proxy
          push: true
          tags: |
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}/wing-ai-proxy:${{ steps.tags.outputs.app_tag }}
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAME_SPACE }}/wing-ai-proxy:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=app-proxy
          cache-to: type=gha,mode=max,scope=app-proxy
