name: Publish to PyPI / TestPyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.2.0, 0.2.0a1)"
        required: true
        type: string
      target:
        description: "Target registry"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: write

jobs:
  # ── Extract version from git tag or manual input ────────────
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
      target: ${{ steps.version.outputs.target }}
    steps:
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TARGET="pypi"
          else
            VERSION="${{ inputs.version }}"
            TARGET="${{ inputs.target }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

          # PEP 440 pre-release detection
          if [[ "$VERSION" =~ [abc]|rc|dev ]]; then
            echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "📦 Version: $VERSION"
          echo "🎯 Target: $TARGET"
          echo "🏷️  Pre-release: $([[ "$VERSION" =~ [abc]|rc|dev ]] && echo yes || echo no)"

  # ── wing-cli: Linux x86_64 ────────────────────────────────────
  build-cli-linux:
    name: wing-cli Linux x86_64
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version into Cargo.toml
        run: python scripts/sync_version.py "${{ needs.resolve-version.outputs.version }}"

      - name: Build wing-cli wheel (manylinux_2_28)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/wing
          args: --release --out ../../dist
          manylinux: "2_28"
          rust-toolchain: stable

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cli-linux
          path: dist/*.whl

  # ── wing-cli: macOS arm64 ─────────────────────────────────────
  build-cli-macos:
    name: wing-cli macOS arm64
    needs: [resolve-version]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Inject version into Cargo.toml
        run: python scripts/sync_version.py "${{ needs.resolve-version.outputs.version }}"

      - name: Build wing-cli wheel
        working-directory: crates/wing
        run: maturin build --release --out ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cli-macos
          path: dist/*.whl

  # ── wing-gateway + wing-agent: py3-none-any ───────────────────
  build-python:
    name: wing-gateway + wing-agent (any)
    needs: [resolve-version]
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build hatch-vcs

      - name: Pin meta-package dependencies
        run: python scripts/sync_version.py "${{ needs.resolve-version.outputs.version }}"

      - name: Build wing-gateway wheel
        working-directory: libs/core
        run: python -m build --wheel --outdir ../../dist

      - name: Build wing-agent wheel
        run: python -m build --wheel --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-python
          path: dist/*.whl

  # ── Publish to PyPI / TestPyPI ────────────────────────────────
  publish:
    needs: [resolve-version, build-cli-linux, build-cli-macos, build-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: List wheels
        run: ls -lh dist/

      - name: Install twine
        run: pip install twine

      - name: Publish to TestPyPI
        if: needs.resolve-version.outputs.target == 'testpypi'
        run: twine upload --repository testpypi dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}

      - name: Publish to PyPI
        if: needs.resolve-version.outputs.target == 'pypi'
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # ── GitHub Release (PyPI only) ────────────────────────────────
  release:
    needs: [resolve-version, publish]
    if: needs.resolve-version.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name: v${{ needs.resolve-version.outputs.version }}
          files: dist/*.whl
          generate_release_notes: true
          prerelease: ${{ needs.resolve-version.outputs.is-prerelease }}
