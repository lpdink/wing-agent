name: Publish to PyPI / TestPyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0, 0.1.0a1)"
        required: true
        type: string
      target:
        description: "Target registry"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: write

jobs:
  # ── Linux (x86_64 only) ───────────────────────────────────────
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: sed -i 's/^version = "0.1.0"/version = "${{ github.event.inputs.version }}"/' libs/core/pyproject.toml

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.0
        env:
          CIBW_PLATFORM: linux
          CIBW_ARCHS: x86_64
          CIBW_BUILD: "cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BEFORE_ALL: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
          CIBW_ENVIRONMENT: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_BUILD_FRONTEND: build
        with:
          package-dir: libs/core
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: wheelhouse/*.whl

  # ── macOS (arm64 only) ─────────────────────────────────────────
  build-macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: sed -i '' 's/^version = "0.1.0"/version = "${{ github.event.inputs.version }}"/' libs/core/pyproject.toml

      - uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.0
        env:
          CIBW_PLATFORM: macos
          CIBW_ARCHS: arm64
          CIBW_BUILD: "cp312-* cp313-*"
          CIBW_BUILD_FRONTEND: build
        with:
          package-dir: libs/core
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: wheelhouse/*.whl

  # ── Publish to PyPI / TestPyPI ─────────────────────────────────
  publish:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: List wheels
        run: ls -lh dist/

      - name: Install twine
        run: pip install twine

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        run: twine upload --repository testpypi dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}

      - name: Publish to PyPI
        if: github.event.inputs.target == 'pypi'
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # ── GitHub Release (PyPI only) ─────────────────────────────────
  release:
    needs: [publish]
    if: github.event.inputs.target == 'pypi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          files: dist/*.whl
          generate_release_notes: true
          prerelease: ${{ contains(github.event.inputs.version, 'a') || contains(github.event.inputs.version, 'b') || contains(github.event.inputs.version, 'rc') || contains(github.event.inputs.version, 'dev') }}
