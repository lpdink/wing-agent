name: Publish to PyPI / TestPyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0, 0.1.0a1)"
        required: true
        type: string
      target:
        description: "Target registry"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: write

jobs:
  # ── wing-cli: Linux x86_64 ────────────────────────────────────
  build-cli-linux:
    name: wing-cli Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: sed -i 's/^version = ".*"/version = "${{ github.event.inputs.version }}"/' crates/wing/pyproject.toml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build wing-cli wheel
        working-directory: crates/wing
        run: maturin build --release --out ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cli-linux
          path: dist/*.whl

  # ── wing-cli: macOS arm64 ─────────────────────────────────────
  build-cli-macos:
    name: wing-cli macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: sed -i '' 's/^version = ".*"/version = "${{ github.event.inputs.version }}"/' crates/wing/pyproject.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build wing-cli wheel
        working-directory: crates/wing
        run: maturin build --release --out ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cli-macos
          path: dist/*.whl

  # ── wing-gateway + wing-agent: py3-none-any ───────────────────
  build-python:
    name: wing-gateway + wing-agent (any)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' pyproject.toml
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' libs/core/pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build wing-gateway wheel
        working-directory: libs/core
        run: python -m build --wheel --outdir ../../dist

      - name: Build wing-agent wheel
        run: python -m build --wheel --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-python
          path: dist/*.whl

  # ── Publish to PyPI / TestPyPI ────────────────────────────────
  publish:
    needs: [build-cli-linux, build-cli-macos, build-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: List wheels
        run: ls -lh dist/

      - name: Install twine
        run: pip install twine

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        run: twine upload --repository testpypi dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}

      - name: Publish to PyPI
        if: github.event.inputs.target == 'pypi'
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # ── GitHub Release (PyPI only) ────────────────────────────────
  release:
    needs: [publish]
    if: github.event.inputs.target == 'pypi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          files: dist/*.whl
          generate_release_notes: true
          prerelease: ${{ contains(github.event.inputs.version, 'a') || contains(github.event.inputs.version, 'b') || contains(github.event.inputs.version, 'rc') || contains(github.event.inputs.version, 'dev') }}
