name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Python: Build and publish wheel to PyPI ──
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: uv build --package wing-agent

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wing-agent-wheel
          path: dist/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}

  # ── Rust: Build TUI binaries ──
  rust:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: wing-linux-amd64
            binary: wing
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: wing-macos-arm64
            binary: wing
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: wing-windows-amd64.exe
            binary: wing.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Rename binary
        shell: bash
        run: mv target/release/${{ matrix.binary }} target/release/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.artifact }}

  # ── GitHub Release ──
  release:
    needs: [python, rust]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.whl
            artifacts/wing-*
          generate_release_notes: true
