# wing-ai-proxy 配置（容器部署版模板）
# 复制为 deploy/proxy/config.yaml 并填入真实上游 key——该文件已被 gitignore。
# 与本地 ~/.wing-ai-proxy/config.yaml 相同结构，仅 host/dsn 适配容器。

host: "0.0.0.0"
port: 39998

# 虚拟 API Key——与 deploy/.env 的 PROXY_API_KEY 保持一致
virtual_api_keys:
  - "sk-change-me"

providers:
  - name: coding-plan
    type: openai
    base_url: "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
    api_key: "sk-CHANGE-ME"
    timeout: 1800s
    models:
      "qwen3.8-max-preview": "qwen3.8-max-preview"
      "deepseek-v4-flash-0731": "deepseek-v4-flash-0731"

  - name: dashscope
    type: openai
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: "sk-CHANGE-ME"
    timeout: 1800s
    models:
      "glm-5.2": "glm-5.2"

database:
  driver: sqlite
  dsn: "/data/sqlite.db"

log_level: "info"
