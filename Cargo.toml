[workspace]
members = ["crates/wing", "crates/wing-api-client"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/abiter/wing"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Terminal UI
ratatui = { version = "0.30", features = ["unstable-widget-ref", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste", "osc52"] }

# Markdown
pulldown-cmark = "0.13"

# Syntax highlighting
syntect = "5"
two-face = "0.5"

# Diff
similar = "3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# HTTP client
# `query` 是 reqwest 0.13 起的显式 feature（默认关闭），`.query(...)` 依赖它。
# TLS 未启用（只连本地 http://127.0.0.1）；若将来需要 https：0.13 默认
# rustls + aws-lc-rs（编译需 C 工具链），交叉编译建议改用 rustls-no-provider。
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }

# Error handling
thiserror = "2"

# Utilities
unicode-width = "0.2"
unicode-linebreak = "0.1.5"
dirs = "7"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
url = "2"
