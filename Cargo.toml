[workspace]
members = ["crates/wing", "crates/wing-api-client", "crates/wing-math"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lpdink/wing-agent"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Terminal UI
ratatui = { version = "0.30", features = ["unstable-widget-ref", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste", "osc52"] }

# Markdown
pulldown-cmark = "0.13"

# Terminal graphics. 默认特性 `chafa-dyn` 需要系统 libchafa + pkg-config（实测直接
# 编译失败），必须 `default-features = false`；`crossterm` 只是让 ratatui 用同一后端。
# 版本锁 11.1.0：与 ratatui 0.30.x 的类型互通性实测过（Picker / SlicedImage /
# SignedPosition / Protocol 均可直接用），且它内部依赖 `image 0.25.x` + `ratatui 0.30.x`。
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }

# 图片解码。`default-features = false` 避免 image 把 tiff/exr/dds/avif 等全拉进来；
# 版本必须与 ratatui-image 内部的 `image ^0.25.6` 同代，否则 `cargo tree` 会出现两份 image。
#
# 开的 codec 必须与 `render/markdown/images.rs` 的 `IMAGE_EXTENSIONS`（以及文档里给用户的
# 验收清单）逐项对齐：只开 `png`+`jpeg` 时，`.gif/.webp/.bmp` 的扩展名会被放行但文件头
# 永远解析不了 → 那三类图只会显示成链接（能力声明与事实不符）。gif/webp/bmp 三个纯 Rust
# codec 的代价实测：release 冷构建 +0.9s（24.1s → 25.0s），`wing` 二进制 +450 KiB
# （13.14 MiB → 13.60 MiB，+3.5%）。`tests/image_pipeline.rs` 有把两侧钉在一起的测试。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Syntax highlighting
syntect = "5"
two-face = "0.5"

# Diff
# `inline` powers word-level emphasis inside a changed line.
similar = { version = "3", features = ["inline"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# HTTP client
# `query` 是 reqwest 0.13 起的显式 feature（默认关闭），`.query(...)` 依赖它。
# TLS 未启用（只连本地 http://127.0.0.1）；若将来需要 https：0.13 默认
# rustls + aws-lc-rs（编译需 C 工具链），交叉编译建议改用 rustls-no-provider。
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }

# Error handling
thiserror = "2"

# Agent Client Protocol —— `wing acp` 前端（stdio 上的 ACP agent 服务端）。
# schema v1 stable；`stdio` feature 提供 `Stdio` 传输（本仓库只充当 agent 侧，
# 不需要 `process`）。
agent-client-protocol = { version = "3.0.0", features = ["stdio"] }

# Utilities
unicode-width = "0.2"
unicode-linebreak = "0.1.5"
dirs = "7"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
url = "2"
