# pnpm workspace + project config (single source of truth for the whole repo).
#
# `packages:` — every TypeScript package lives here; the three shells (vscode today,
# web / electron later) are plain members and share one lockfile at the root.
# `pnpm -r run <script>` (what `make check-ts` / `make test-ts` use) walks this list;
# a new package needs no other registration (see 02_workspace_client_pkg/design.md §手册).
packages:
  - 'extensions/vscode'
  - 'packages/*'
  - 'apps/*'

# allowBuilds: pnpm 10+ blocks dependency install scripts unless allow-listed.
#   - esbuild needs its install script to place the platform binary.
#   - @vscode/vsce-sign is only pulled in by `vsce sign` (we ship an unsigned local
#     .vsix), so its script stays blocked on purpose.
#   - playwright's install script downloads browser builds. Blocked on purpose:
#     `pnpm --filter @wing-agent/web shot` drives the *local* Chrome
#     (`channel: 'chrome'`), so a fresh `pnpm install` stays fast and CI never
#     downloads ~150 MB it does not use. Install one explicitly when needed:
#     `pnpm --filter @wing-agent/web exec playwright install chromium`.
#
# minimumReleaseAgeExclude: the workspace-level npm supply-chain guard refuses
# packages published very recently; prettier is pinned here so the lockfile stays
# reproducible with `--frozen-lockfile` on CI as well.
allowBuilds:
  esbuild: true
  '@vscode/vsce-sign': false
  playwright: false
minimumReleaseAgeExclude:
  - prettier@3.9.8
