# pnpm workspace + project config (single source of truth for the whole repo).
#
# `packages:` — every TypeScript package lives here; the three shells (vscode today,
# web / electron later) are plain members and share one lockfile at the root.
# `pnpm -r run <script>` (what `make check-ts` / `make test-ts` use) walks this list;
# a new package needs no other registration — it only has to declare the scripts
# (lint / format:check / typecheck / test); see docs/dev/vscode-extension.md §9.3.
packages:
  - 'extensions/vscode'
  - 'packages/*'
  - 'apps/*'

# allowBuilds: pnpm 10+ blocks dependency install scripts unless allow-listed.
#   - esbuild needs its install script to place the platform binary.
#   - @vscode/vsce-sign is only pulled in by `vsce sign` (we ship an unsigned local
#     .vsix), so its script stays blocked on purpose.
#
# minimumReleaseAgeExclude: `minimumReleaseAge` (the guard that refuses packages
# published very recently) is not enabled today, so this entry is inert — it is kept
# so the guard can be switched on without re-resolving prettier. The version has to
# match the one resolved in pnpm-lock.yaml (it drifted once, with a lockfile
# regeneration: the entry said 3.9.8 while the lockfile had moved to 3.9.9).
allowBuilds:
  esbuild: true
  '@vscode/vsce-sign': false
minimumReleaseAgeExclude:
  - prettier@3.9.9
