[project]
name = "wing-dingtalk"
version = "0.1.0"
description = "Wing DingTalk frontend — chat with Wing agents over DingTalk"
readme = "README.md"
authors = [
    { name = "abiter", email = "lpdink@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dingtalk-stream>=0.24.3",
    "wing-sdk",
    "httpx>=0.27",
    "websockets>=13.0",
]

[project.scripts]
wing-dingtalk = "wing_dingtalk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wing_dingtalk"]

[tool.uv.sources]
wing-sdk = { workspace = true }
