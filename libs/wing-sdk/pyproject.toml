[project]
name = "wing-sdk"
version = "0.1.0"
description = "Wing Gateway SDK — remote tool registration + orchestration"
requires-python = ">=3.12"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.scripts]
wing-orch = "wing_sdk.orch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wing_sdk"]
