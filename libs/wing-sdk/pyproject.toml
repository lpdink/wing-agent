[project]
name = "wing-sdk"
version = "0.1.0"
description = "Wing Gateway SDK — remote tool registration and serving"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wing_sdk"]
