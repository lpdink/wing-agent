# wing-probe — 确定性集成测试基础设施（假 Provider + 断言库 + 场景）
#
# 独立包，硬约束：不得 import wing（由 wing_probe/guard.py 门禁强制）。
# 详见 openspec/changes/wing-probe/design.md（D1–D12）。

[project]
name = "wing-probe"
version = "0.1.0"
description = "Deterministic integration test harness for wing — fake provider, assertions, scenarios"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
    "websockets>=13.0",
    "wing-sdk",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wing_probe"]

[tool.uv.sources]
wing-sdk = { workspace = true }

# 局部 pytest 配置：让 `pytest libs/wing-probe/...` 以本目录为 rootdir，
# 避免与仓库根配置的 rootdir 歧义。
#
# 注意：本目录成为 rootdir 后**根配置不生效**，因此这里与仓库根逐项对齐
# （`asyncio_mode` 与 `filterwarnings` 同款）——probe 会起 aiohttp / websockets
# / 网关子进程，asyncio 关闭期的未回收异常不该把场景判红。
[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
