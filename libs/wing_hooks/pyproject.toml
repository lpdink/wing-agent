[project]
name = "wing-hooks"
dynamic = ["version"]
description = "Official hook implementations for wing agent runtime"
requires-python = ">=3.12"
dependencies = [
    "wing-gateway",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.hooks.vcs]
version-file = "wing_hooks/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["wing_hooks"]

# wing-hooks 不提供任何可运行程序——[project.scripts] 不存在