[project]
name = "wing-hooks"
version = "0.1.0"
description = "Official hook implementations for wing agent runtime"
requires-python = ">=3.12"
dependencies = [
    "wing-gateway",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wing_hooks"]

# wing-hooks 不提供任何可运行程序——[project.scripts] 不存在