[project]
name = "wing-gateway"
dynamic = ["version"]
description = "General-purpose agent runtime — session, event, context, tools, WebSocket gateway"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = []
keywords = ["agent", "runtime", "llm", "session", "websocket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aioconsole>=0.8.2",
    "fastapi>=0.139.0",
    "httpx>=0.27",
    "pydantic-settings>=2.13.1",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.51.0",
]

[project.urls]
Homepage = "https://github.com/lpdink/wing-agent"
Repository = "https://github.com/lpdink/wing-agent"
Issues = "https://github.com/lpdink/wing-agent/issues"
Changelog = "https://github.com/lpdink/wing-agent/releases"
Documentation = "https://github.com/lpdink/wing-agent/blob/develop/docs/zh/README.md"

[project.scripts]
wing-gateway = "wing.gateway.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.hooks.vcs]
version-file = "wing/_version.py"

# 构建时注入 wing/_build_info.py（版本 + commit hash），见 hatch_build.py
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["wing"]
