[project]
name = "wing-gateway"
dynamic = ["version"]
description = "General-purpose agent runtime — session, event, context, tools, WebSocket gateway"
requires-python = ">=3.12"
license-files = []
dependencies = [
    "aioconsole>=0.8.2",
    "fastapi>=0.139.0",
    "openai>=2.21.0",
    "pydantic-settings>=2.13.1",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
wing-gateway = "wing.gateway.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.hooks.vcs]
version-file = "wing/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["wing"]
