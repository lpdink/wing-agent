# wing-agent — meta package + workspace root
# pip install wing-agent → 安装 wing-cli + wing-gateway

[project]
name = "wing-agent"
dynamic = ["version"]
description = "General-purpose coding agent — Rust TUI/CLI + Python gateway runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agent", "coding-agent", "llm", "cli", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "wing-cli",
    "wing-gateway",
]

[project.urls]
Homepage = "https://github.com/lpdink/wing-agent"
Repository = "https://github.com/lpdink/wing-agent"
Issues = "https://github.com/lpdink/wing-agent/issues"
Changelog = "https://github.com/lpdink/wing-agent/releases"
Documentation = "https://github.com/lpdink/wing-agent/blob/develop/docs/zh/README.md"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "wing_agent/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["wing_agent"]

[tool.uv.workspace]
members = [
    "libs/core",
    "libs/wing-sdk",
    "libs/wing-orch",
    "libs/wing-probe",
    "crates/wing",
]

[tool.uv.sources]
wing-cli = { workspace = true }
wing-gateway = { workspace = true }
wing-sdk = { workspace = true }
wing-orch = { workspace = true }
wing-probe = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "ty>=0.0.24",
    "vulture>=2.16",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "claude-agent-sdk>=0.2.0",
    "pytest-timeout>=2.3.0",
    "maturin>=1.9.3,<2.0",
    "hatchling>=1.27",
    "wing-sdk",
    "wing-orch",
    "wing-probe",
]

[tool.ruff.lint]
select = ["ANN", "F"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["ANN"]
"libs/wing_hooks/*" = ["ANN"]

[tool.vulture]
exclude = [".venv/", "wing_ext/"]
min_confidence = 70

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
