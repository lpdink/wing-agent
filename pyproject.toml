# wing-agent — meta package + workspace root
# pip install wing-agent → 安装 wing-cli + wing-gateway

[project]
name = "wing-agent"
dynamic = ["version"]
description = "General-purpose coding agent — Rust TUI/CLI + Python gateway runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agent", "coding-agent", "llm", "cli", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "wing-cli",
    "wing-gateway",
]

[project.urls]
Homepage = "https://github.com/lpdink/wing-agent"
Repository = "https://github.com/lpdink/wing-agent"
Issues = "https://github.com/lpdink/wing-agent/issues"
Changelog = "https://github.com/lpdink/wing-agent/releases"
Documentation = "https://github.com/lpdink/wing-agent/blob/develop/docs/zh/README.md"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "wing_agent/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["wing_agent"]

[tool.uv.workspace]
members = [
    "libs/core",
    "libs/wing-sdk",
    "libs/wing-probe",
    "crates/wing",
]

[tool.uv.sources]
wing-cli = { workspace = true }
wing-gateway = { workspace = true }
wing-sdk = { workspace = true }
wing-probe = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "ty>=0.0.24",
    "vulture>=2.16",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3.0",
    # probe 场景按核数并行（`make test-probe` 的 `-n`；见 docs/dev/probe-testing.md）。
    "pytest-xdist>=3.8.0",
    "maturin>=1.9.3,<2.0",
    "hatchling>=1.27",
    "wing-sdk",
    "wing-probe",
]

[tool.ruff.lint]
select = ["ANN", "F"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["ANN"]
"libs/wing_hooks/*" = ["ANN"]

# vulture 门禁跑在 60 档：「未用 import（90）/ 不可达代码（100）」之外的
# 「没人调用的函数 / 方法 / 属性（60）」才是有价值的死代码信号。60 档必须配
# 白名单——框架装饰器（FastAPI 路由、pydantic 校验器、hook 注册、pytest
# fixture）与「只被外部消费」的字段/API 都会被误报，两类分别在
# `ignore_decorators` 与 `.vulture_whitelist.py`（分组 + 逐条理由）里安放。
[tool.vulture]
paths = ["libs/", ".vulture_whitelist.py"]
exclude = [".venv/"]
min_confidence = 60
ignore_names = ["model_config", "relpath", "side_effect", "pytestmark"]
ignore_decorators = [
    "@router.get",
    "@router.post",
    "@router.websocket",
    "@app.exception_handler",
    "@field_validator",
    "@model_validator",
    "@model_serializer",
    "@hooks.on",
    "@metrics_registry.on",
    "@tool_registry.register",
    "@pytest.fixture",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "probe_env(**kwargs): 覆盖 ProbeEnv 启动参数（libs/wing-probe/conftest.py 的 probe fixture 消费）",
]
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# ── 单测覆盖率（门禁口径）────────────────────────────────────
# source 写包名而不是让 coverage 只统计「被导入过的」文件：没被任何测试碰到的
# 模块必须以 0% 出现，否则「漏测整个模块」会被静默豁免。
# 口径 = 语句 + 分支（combined）：纯语句覆盖率看不出「if 只走了一边」。
[tool.coverage.run]
branch = true
source = ["wing", "wing_sdk"]

[tool.coverage.report]
# hatch-vcs 的构建产物：不在 git 里，其内容取决于构建时的 commit
omit = ["*/_version.py"]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
show_missing = true
# 门禁阈值（本地 `make test-python` 与 CI 同一条命令、同一个数）：
# 1 位小数精度，避免默认的整数四舍五入把 95.6 当成 96 放过；
# 95.0 给常规改动留出约 130 条语句的余量，真正"整块没测"会立刻撞线。
fail_under = 95
precision = 1
