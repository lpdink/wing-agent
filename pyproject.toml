# wing-agent — meta package + workspace root
# pip install wing-agent → 安装 wing-cli + wing-gateway

[project]
name = "wing-agent"
dynamic = ["version"]
description = "General-purpose coding agent — Rust TUI/CLI + Python gateway runtime"
requires-python = ">=3.12"
license-files = []
dependencies = [
    "wing-cli",
    "wing-gateway",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "wing_agent/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["wing_agent"]

[tool.uv.workspace]
members = ["libs/core", "libs/wing-sdk", "libs/wing-orch", "crates/wing"]

[tool.uv.sources]
wing-cli = { workspace = true }
wing-gateway = { workspace = true }
wing-sdk = { workspace = true }
wing-orch = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "ty>=0.0.24",
    "vulture>=2.16",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "claude-agent-sdk>=0.2.0",
    "pytest-timeout>=2.3.0",
    "maturin>=1.9.3,<2.0",
    "wing-sdk",
    "wing-orch",
]

[tool.ruff.lint]
select = ["ANN", "F"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["ANN"]
"libs/wing_hooks/*" = ["ANN"]

[tool.vulture]
exclude = [".venv/", "wing_ext/"]
min_confidence = 70

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
