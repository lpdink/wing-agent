# wing-agent — meta package + workspace root
# pip install wing-agent → 安装 wing-cli + wing-gateway

[project]
name = "wing-agent"
version = "0.1.0"
description = "General-purpose coding agent — Rust TUI/CLI + Python gateway runtime"
requires-python = ">=3.12"
dependencies = [
    "wing-cli",
    "wing-gateway",
    "wing-hooks",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.uv.workspace]
members = ["libs/core", "libs/wing_hooks", "crates/wing"]

[tool.uv.sources]
wing-cli = { workspace = true }
wing-gateway = { workspace = true }
wing-hooks = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "ty>=0.0.24",
    "vulture>=2.16",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.vulture]
exclude = [".venv/", "wing_ext/"]
min_confidence = 70

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
